[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "steam-companion-mcp"
version = "0.1.0"
description = "A personal, read-only Steam MCP server with Steam OpenID and OAuth 2.1 authorization."
requires-python = ">=3.13"
dependencies = [
  "aiosqlite>=0.21,<1",
  "cryptography>=45,<47",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "mcp>=2.0,<3",
  "pydantic-settings>=2.10,<3",
  "pyjwt[crypto]>=2.10,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9", "pytest-asyncio>=1.1,<2", "ruff>=0.12,<1", "mypy>=1.17,<2", "httpx>=0.28,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/steam_companion"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
