services:
  steam-companion:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    mem_limit: 128m
    memswap_limit: 128m
    env_file: .env
    environment:
      DATABASE_URL: sqlite+aiosqlite:////data/steam-companion.sqlite3
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:${APP_PORT:-8000}"
    volumes:
      - steam_data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  steam_data:
